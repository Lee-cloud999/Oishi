<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oishi - 오이 피하기 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background-color: #2b2b2b;
            border: 4px solid #4CAF50;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #player {
            position: absolute;
            bottom: 20px;
            left: 180px;
            width: 40px;
            height: 40px;
            background-color: #FF5722;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        .cucumber {
            position: absolute;
            top: -40px;
            width: 30px;
            height: 50px;
            background-color: #4CAF50;
            border-radius: 15px;
        }
        #ui {
            margin-top: 15px;
            font-size: 1.2rem;
            display: flex;
            gap: 20px;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>Oishi : 오이 피하기 🥒</h1>
    
    <div id="game-container">
        <div id="player">나</div>
        
        <div id="start-screen">
            <h2 style="margin-bottom: 20px; color: #fff;">오이를 피해 도망쳐라!</h2>
            <button onclick="startGame()">게임 시작</button>
        </div>
    </div>

    <div id="ui">
        <div>점수: <span id="score">0</span>점</div>
        <div>최고 기록: <span id="high-score">0</span>점</div>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const startScreen = document.getElementById('start-screen');

        let playerX = 180;
        let score = 0;
        let highScore = localStorage.getItem('oishi_high_score') || 0;
        let isPlaying = false;
        let cucumbers = [];
        let gameInterval, spawnInterval;

        highScoreElement.innerText = highScore;

        // 조작 (키보드 좌우 이동)
        document.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft' && playerX > 0) {
                playerX -= 20;
            } else if (e.key === 'ArrowRight' && playerX < 360) {
                playerX += 20;
            }
            player.style.left = playerX + 'px';
        });

        // 모바일 터치 조작 지원
        container.addEventListener('touchmove', (e) => {
            if (!isPlaying) return;
            let rect = container.getBoundingClientRect();
            let touchX = e.touches[0].clientX - rect.left;
            playerX = Math.max(0, Math.min(360, touchX - 20));
            player.style.left = playerX + 'px';
        });

        function startGame() {
            startScreen.style.display = 'none';
            container.querySelectorAll('.cucumber').forEach(c => c.remove());
            cucumbers = [];
            score = 0;
            playerX = 180;
            player.style.left = playerX + 'px';
            scoreElement.innerText = score;
            isPlaying = true;

            // 게임 루프
            gameInterval = setInterval(updateGame, 20);
            spawnInterval = setInterval(spawnCucumber, 800);
        }

        function spawnCucumber() {
            let cucumber = document.createElement('div');
            cucumber.classList.add('cucumber');
            let cucumberX = Math.floor(Math.random() * 370);
            cucumber.style.left = cucumberX + 'px';
            cucumber.style.top = '-50px';
            container.appendChild(cucumber);

            cucumbers.push({ element: cucumber, x: cucumberX, y: -50 });
        }

        function updateGame() {
            score++;
            scoreElement.innerText = score;

            // 오이 떨어뜨리기
            for (let i = cucumbers.length - 1; i >= 0; i--) {
                let c = cucumbers[i];
                c.y += 5; // 떨어지는 속도
                c.element.style.top = c.y + 'px';

                // 바닥에 닿으면 삭제
                if (c.y > 600) {
                    c.element.remove();
                    c.cucumbers = null;
                    cucumbers.splice(i, 1);
                    continue;
                }

                // 충돌 감지 (플레이어와 오이)
                if (c.y > 520 && c.y < 580 && Math.abs(c.x - playerX) < 30) {
                    gameOver();
                }
            }
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('oishi_high_score', highScore);
                highScoreElement.innerText = highScore;
            }

            startScreen.style.display = 'flex';
            startScreen.querySelector('h2').innerText = `게임 오버! 점수: ${score}점`;
            startScreen.querySelector('button').innerText = '다시 시작';
        }
    </script>
</body>
</html>
